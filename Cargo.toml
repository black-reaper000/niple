[workspace]
resolver = "2"
members = [
    "protocol",
    "sender",
    "receiver",
    "dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LAN Audio Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shun/lan-audio"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdns-sd = "0.13"
cpal = "0.15"
byteorder = "1.5"
bytes = "1.9"
